{% extends "blog_base.html" %}

{%block title%}Home page{%endblock%}

{%block content%}
<body>
<div class="container mt-5">
    <h1 class="mb-4">{{ post.name }}</h1>
    <p>{{ post.content }}</p>
    {% if post.preview %}
    <img src="{{ post.preview.url }}"
         class="card-img-top"
         alt="{{ post.name }}"
         >
    {% else %}
    <!-- Заглушка, если изображения нет -->
    <svg class="bd-placeholder-img card-img-top" width="100%" height="225"
         xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Placeholder: Эскиз"
         preserveAspectRatio="xMidYMid slice" focusable="false">
        <title>Placeholder</title>
        <rect width="100%" height="100%" fill="#55595c"></rect>
        <text x="50%" y="50%" fill="#eceeef" dy=".3em">Нет фото</text>
    </svg>
    {% endif %}
    <p>Создано: {{ post.created_at }}</p>
    <a href="{% url 'blogs:update' post.pk %}" class="btn btn-secondary">Редактировать</a>
    <a href="{% url 'blogs:delete' post.pk %}" class="btn btn-danger">Удалить</a>
    <a href="{% url 'blogs:home' %}" class="btn btn-primary">Вернуться к списку</a>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
{%endblock%}
