{% extends "base.html" %}

{%block title%}Удаление{%endblock%}

{%block content%}
<body>
<div class="container mt-5">
    <h1 class="mb-4">Удалить объект продукта</h1>
    <p>Вы уверены, что хотите удалить "{{ object.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
{%endblock%}
