{% extends "base.html" %}

{%block title%}Добавление товара{%endblock%}

{%block content%}
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6">
            <h1 class="mb-4">Форма MyModel</h1>
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Сохранить</button>
                <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
            </form>
        </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>

<style>
    form p {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
    }

    form label {
        margin-bottom: 5px;
        font-weight: 500;
    }

    form input, form select, form textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        box-sizing: border-box;
    }

    .errorlist {
        color: red;
        margin: 5px 0 0 0;
        padding-left: 0;
        list-style: none;
        font-size: 14px;
    }
</style>
{%endblock%}
