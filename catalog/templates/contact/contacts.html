{% extends "base.html" %}

{%block title%}Контакты{%endblock%}

{%block content%}
<div class="offset-2 col-md-10 p-4">
    <h1 class="text-center mb-5">Контакты</h1>
    <div class="row justify-content-center">
        <div class="col-md-5 border border-success p-2 mb-2 border-light-subtle">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="name" class="form-label fs-5">Имя</label>
                    <input type="text" class="form-control" id="name" name="name" placeholder="Иван Иванов">
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label fs-5">Почта</label>
                    <div class="input-group">
                        <span class="input-group-text">@</span>
                        <input type="email" class="form-control" id="email" name="email"
                               placeholder="mail@example.com">
                    </div>
                </div>

                <div class="mb-3">
                    <label for="message" class="form-label fs-5">Сообщение</label>
                    <textarea class="form-control" id="message" name="message"
                              aria-label="Сообщение"></textarea>
                </div>

                <button type="submit" class="btn btn-primary">Отправить</button>
            </form>

        </div>
        <div class="col-md-5 fs-4 offset-md-1">
            Наши контакты
            <div class="row">
                <div class="col-12">
                    Здесь будет текст
                </div>
            </div>
        </div>
    </div>
</div>

{%endblock%}
