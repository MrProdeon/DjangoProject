<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{%block title%}OnlineStore{%endblock%}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="../../../static/js/bootstrap.bundle.min.js"></script>
</head>

<body>
<div class="container-fluid px-0">
    <div class="row g-0">

        <!-- Боковое меню -->
        {% include 'menu.html' %}

        <div class="offset-2 col-md-10 p-4">
            <div class="container mt-4">
                <h1 class="text-center mb-4">Главная</h1>
                <p class="text-center lead mb-5">Вы находитесь на сайте, предназначенном для продажи товаров.</p>
                {%block content%}{%endblock%}
            </div>
        </div>
    </div>
</div>
</body>

</html>
